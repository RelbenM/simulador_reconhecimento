<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Simulador de Reconhecimento{% endblock %} · Gestão de Pessoas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-icon d-lg-none" id="btnMenu" aria-label="Abrir menu"><i class="bi bi-list"></i></button>
      <i class="bi bi-award-fill brand-icon"></i>
      <div class="lh-1">
        <div class="brand-title">Simulador de Reconhecimento</div>
        <small class="brand-sub">Gestão de Pessoas</small>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2 user-box">
      <i class="bi bi-person-circle fs-5"></i>
      <span class="d-none d-sm-inline">GP — Usuário Administrador</span>
    </div>
  </header>

  <div class="sidebar-backdrop" id="backdrop"></div>
  <aside class="app-sidebar" id="sidebar">
    <nav class="nav flex-column">
      <a class="side-link {{ 'active' if request.endpoint == 'home' }}" href="{{ url_for('home') }}">
        <i class="bi bi-house-door"></i><span>Início</span>
      </a>
      <button class="side-link side-toggle" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuSetores" aria-expanded="true" aria-controls="menuSetores">
        <i class="bi bi-diagram-3"></i><span>Setores</span><i class="bi bi-chevron-down chevron ms-auto"></i>
      </button>
      <div class="collapse show" id="menuSetores">
        {% for s in setores_menu %}
        <a class="side-sublink {{ 'active' if s.id == setor_ativo_id }}"
           href="{{ url_for('setor', setor_id=s.id) }}">{{ s.nome }}</a>
        {% endfor %}
      </div>
      <a class="side-link {{ 'active' if request.endpoint == 'logs' }}" href="{{ url_for('logs') }}">
        <i class="bi bi-journal-text"></i><span>Logs</span>
      </a>
    </nav>
  </aside>

  <main class="app-main">
    <div id="alertas"></div>
    {% block content %}{% endblock %}
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
